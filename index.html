<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balkan Ragebait Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div class="container">
  <h1>🧨 Balkan Ragebait Generator</h1>
  <p>For memes, parody, and fictional chaos only.</p>

  <!-- Theme Switch -->
  <label class="switch">
    <input type="checkbox" id="themeToggle">
    <span class="slider"></span> Dark / Light
  </label>

  <!-- Category Selector -->
  <div class="categories">
    <label><input type="checkbox" value="Food" checked> Food</label>
    <label><input type="checkbox" value="History" checked> History</label>
    <label><input type="checkbox" value="Bureaucracy" checked> Bureaucracy</label>
    <label><input type="checkbox" value="Driving" checked> Driving</label>
    <label><input type="checkbox" value="General" checked> General</label>
  </div>

  <!-- Numerical Mode -->
  <label class="switch">
    <input type="checkbox" id="numMode"> 
    <span class="slider"></span> Numerical Uncle Mode
  </label>

  <button onclick="generate()">Generate Ragebait</button>
  <button onclick="copyText()">📋 Copy to Clipboard</button>

  <div id="output" class="output">Click generate 👀</div>
</div>

<script src="script.js"></script>
</body>
</html>
