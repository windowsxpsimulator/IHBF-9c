<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Balkan Ragebait Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <h1>🔥 Balkan Ragebait Generator</h1>

  <!-- Ragebait box -->
  <div id="ragebait-box">
    <p id="output">Click “Generate Ragebait”</p>
  </div>

  <!-- Toggles -->
  <div class="toggle-row">
    <label>
      <input type="checkbox" id="themeToggle">
      🌙 / ☀️
    </label>

    <label>
      <input type="checkbox" id="uncleToggle">
      Uncle Numerical Mode
    </label>
  </div>

  <!-- Buttons -->
  <div class="button-row">
    <button onclick="generateRagebait()">Generate Ragebait</button>
    <button onclick="copyToClipboard()">Copy to Clipboard</button>
  </div>

  <!-- Categories -->
  <div class="category-row">
    <button class="cat active" onclick="setCategory('general')">General</button>
    <button class="cat" onclick="setCategory('food')">Food</button>
    <button class="cat" onclick="setCategory('history')">History</button>
    <button class="cat" onclick="setCategory('bureaucracy')">Bureaucracy</button>
    <button class="cat" onclick="setCategory('driving')">Driving</button>
  </div>

  <!-- Language selector -->
  <div class="language-container">
    <button id="languageButton">🌍 Language</button>
    <div id="languageMenu" class="language-menu hidden">
      <button onclick="loadLanguage('en')">🇬🇧 English</button>
      <button onclick="loadLanguage('bg')">🇧🇬 България</button>
      <button onclick="loadLanguage('rs_lat')">🇷🇸 Republika Srbija</button>
      <button onclick="loadLanguage('rs_cyr')">🇷🇸 Република Србија</button>
      <button onclick="loadLanguage('gr')">🇬🇷 Ελλάδα</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
