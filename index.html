<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balkan Ragebait Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div class="container">
  <h1>🧨 Balkan Ragebait Generator</h1>
  <p>For memes, parody, and fictional chaos only.</p>

  <!-- Top Buttons -->
  <div class="top-buttons">
    <button onclick="generate()">Generate Ragebait</button>
    <button onclick="copyText()">📋 Copy to Clipboard</button>
  </div>

  <!-- Categories Below Buttons -->
  <div class="categories">
    <label><input type="checkbox" value="Food"> Food</label>
    <label><input type="checkbox" value="History"> History</label>
    <label><input type="checkbox" value="Bureaucracy"> Bureaucracy</label>
    <label><input type="checkbox" value="Driving"> Driving</label>
    <label><input type="checkbox" value="General" checked> General</label>
  </div>

  <!-- Output -->
  <div id="output" class="output">Click generate 👀</div>

  <!-- Bottom Toggles -->
  <div class="bottom-toggles">
    <!-- Light Mode Switch -->
    <div id="lightModeBox" class="toggle-box">
      <label class="switch">
        <input type="checkbox" id="themeToggle" checked>
        <span class="slider"></span> Dark / Light
      </label>
    </div>

    <!-- Numerical Uncle Switch -->
    <div id="numUncleBox" class="toggle-box">
      <label class="switch">
        <input type="checkbox" id="numMode"> 
        <span class="slider"></span> Numerical Uncle Mode
      </label>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
